# Configuration globale de Nomade.
# Copiez config/nomade.local.toml.example vers config/nomade.local.toml
# pour vos surcharges locales (URL de chat, interface Bluetooth, chemin de
# venv non standard, etc.). Ce fichier suivi par Git reste volontairement
# sans secret.

[general]
language = "fr"

[paths]
# Laissez vide pour utiliser automatiquement le dépôt courant.
repository = ""
python_venv = "/opt/nomade-venv"
data_dir = "/var/lib/nomade"
log_dir = "/var/log/nomade"

[obs]
host = "127.0.0.1"
port = 4455
wait_seconds = 30
collection = ""
scene = "Scene principale"
profile_preparation = "Nomade preparation"
profile_direct = "Nomade direct fixe"
source_selfie = "Selfie"
source_carte = "Carte"
source_vitesse = "Vitesse"
source_pulsations = "Pulsations"
source_meteo = "Meteo"
source_heure = "Heure"

[mqtt]
host = "127.0.0.1"
port = 1883
topic = "nomade/capteurs"
client_id = "nomade-capteurs"
keepalive = 30
network_interface = "bnep0"
bluetooth_device_name = ""
bluetooth_device_address = ""

[chat]
service = "none"
source_name = "Chat multicanal"
enabled_by_default = false
velora_url = ""
botrix_url = ""
custom_url = ""

[[video_sources]]
id = "g7_principal"
label = "Lumix G7 principal"
type = "capture_usb"
obs_source_name = "G7 Principal"
group = "camera_principale"
enabled_by_default = true

[[video_sources]]
id = "g7_secours"
label = "Lumix G7 secours"
type = "capture_usb"
obs_source_name = "G7 Secours"
group = "camera_principale"
enabled_by_default = false

[[video_sources]]
id = "xiaomi_arriere"
label = "Xiaomi 11T grand angle"
type = "srt"
obs_source_name = "Xiaomi Arriere"
group = "camera_principale"
enabled_by_default = false
srt_port = 9001

[[video_sources]]
id = "xiaomi_selfie"
label = "Xiaomi 11T selfie"
type = "srt"
obs_source_name = "Xiaomi Selfie"
group = "vignette_visage"
enabled_by_default = true
srt_port = 9000

# Liste évolutive : adaptez ces presets à votre usage réel.
[[presets]]
id = "sans_reperes"
label = "Sans repères"
activer = []
desactiver = ["carte", "vitesse"]

[[presets]]
id = "trajet"
label = "Trajet"
activer = ["carte", "vitesse"]
desactiver = []

[display]
window_geometry = "1024x600"
show_chat_panel = true

[features]
autostart_obs = true
sync_chat_browser_source = true
autostart_stream_on_launch = false

[streaming]
# Préparation pour une évolution future : Nomade ne modifie pas encore les
# destinations OBS ni les clés de diffusion.
active_destination = ""
notes = "Préparez OBS dans OBS-Preparation ; ne stockez aucune clé secrète ici."

[[streaming.destinations]]
name = "twitch"
service = "twitch"
obs_profile = "Nomade direct fixe"
enabled = false

[[streaming.destinations]]
name = "kick"
service = "kick"
obs_profile = "Nomade direct fixe"
enabled = false
